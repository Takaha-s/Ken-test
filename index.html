<!DOCTYPE html>
<html>
  <head>
    <!-- A-Frame 本体の読み込み -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js の読み込み -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- ARシーンの定義 -->
    <a-scene embedded arjs>
      <!-- Hiroマーカーを認識した時に表示する内容 -->
      <a-marker preset="hiro">
        <a-box 
          position="0 0.5 0" 
          material="color: #4CC3D9; opacity: 0.8;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
          animation__2="property: position; to: 0 0.8 0; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
        </a-box>
      
        <a-cylinder radius="0.5" height="0.01" color="#333" opacity="0.5"></a-cylinder>
      </a-marker>
      <!-- AR用のカメラ -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
